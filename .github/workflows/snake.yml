.github/workflows/snake.yml


name: Generate Snake Animation

on:
  # Roda automaticamente 1x por dia (00:00 UTC)
  schedule:
    - cron: "0 0 * * *"
  # Permite rodar manualmente pelo botão "Run workflow"
  workflow_dispatch:
  # Roda toda vez que você der push na branch main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=7A5CFF&color_dots=0D1117,3a2a6b,5b3fb0,7A5CFF,5BC0FF
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
